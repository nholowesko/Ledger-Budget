<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ledger — Budget Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ledger" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    --paper: #E7EFE4; --card: #F4F8F1; --ink: #1F2E22; --ink-soft: #4B5B4C;
    --rule: #B9CBB3; --green: #2F5233; --red: #A22C2C;
    background: var(--paper); color: var(--ink); font-family: 'Inter', system-ui, sans-serif;
  }
  .app { min-height: 100vh; max-width: 480px; margin: 0 auto; padding-bottom: 84px; position: relative; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .topbar { padding: 22px 20px 14px; border-bottom: 1px solid var(--rule);
    background: repeating-linear-gradient(var(--paper), var(--paper) 27px, var(--rule) 28px); }
  .brand { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 26px; display: flex; align-items: baseline; gap: 8px; }
  .brand small { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); font-weight: 500; letter-spacing: 1px; text-transform: uppercase; }
  .month-switch { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; }
  .month-switch .label { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 15px; letter-spacing: 0.5px; }
  .icon-btn { background: var(--card); border: 1px solid var(--rule); border-radius: 6px; width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center; color: var(--ink); cursor: pointer;
    font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; }
  .icon-btn:active { transform: translateY(1px); }
  .totals-row { display: flex; gap: 10px; padding: 14px 20px 4px; }
  .total-card { flex: 1; background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; }
  .total-card .k { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-soft); font-family: 'IBM Plex Mono', monospace; }
  .total-card .v { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 21px; margin-top: 2px; }
  .total-card .v.red { color: var(--red); }
  .section-title { padding: 18px 20px 6px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--ink-soft); }
  .cat-list { padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 10px; }
  .cat-card { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; }
  .cat-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .cat-name { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
  .cat-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
  .cat-amounts { font-family: 'IBM Plex Mono', monospace; font-size: 13px; text-align: right; }
  .cat-amounts .over { color: var(--red); font-weight: 600; }
  .ruler-track { position: relative; height: 14px; background: #DCE6D8; border-radius: 3px; overflow: hidden; border: 1px solid var(--rule); }
  .ruler-fill { height: 100%; border-radius: 2px; }
  .ruler-ticks { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent, transparent 9%, rgba(31,46,34,0.18) 9%, rgba(31,46,34,0.18) calc(9% + 1px)); pointer-events: none; }
  .cat-foot { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; color: var(--ink-soft); font-family: 'IBM Plex Mono', monospace; }
  .tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px;
    background: var(--card); border-top: 1px solid var(--rule); display: flex; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); gap: 6px; }
  .tab-btn { flex: 1; border: none; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 6px 0; color: var(--ink-soft); font-family: 'IBM Plex Mono', monospace; font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.5px; border-radius: 8px; cursor: pointer; }
  .tab-btn .glyph { font-family: 'Fraunces', Georgia, serif; font-size: 16px; font-weight: 600; }
  .tab-btn.active { color: var(--green); background: #DCE6D8; }
  .panel { padding: 8px 20px 20px; }
  .form-card { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 14px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-soft); margin-bottom: 5px; font-family: 'IBM Plex Mono', monospace; }
  .field select, .field input { width: 100%; padding: 9px 10px; border: 1px solid var(--rule); border-radius: 7px; background: #fff; font-family: 'Inter', system-ui, sans-serif; font-size: 15px; color: var(--ink); }
  .field input.mono-input { font-family: 'IBM Plex Mono', monospace; }
  .btn { width: 100%; padding: 11px; border-radius: 8px; border: none; background: var(--green); color: #F4F8F1; font-weight: 600; font-size: 14px; cursor: pointer; }
  .btn:active { transform: translateY(1px); }
  .btn.secondary { background: var(--card); color: var(--green); border: 1px solid var(--green); }
  .btn-row { display: flex; gap: 8px; }
  .btn-row .btn { flex: 1; }
  .expense-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .expense-row:last-child { border-bottom: none; }
  .expense-main { display: flex; flex-direction: column; }
  .expense-desc { font-size: 14px; font-weight: 500; }
  .expense-meta { font-size: 11px; color: var(--ink-soft); font-family: 'IBM Plex Mono', monospace; margin-top: 2px; }
  .expense-amt { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 14px; margin-right: 10px; }
  .del-btn { background: none; border: none; color: #9a7b6f; cursor: pointer; padding: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 16px; }
  .allocate-card { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 14px; margin-bottom: 16px; }
  .allocate-head { display: flex; align-items: center; gap: 8px; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 16px; margin-bottom: 10px; }
  .allocate-summary { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--rule); display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
  .allocate-summary .neg { color: var(--red); font-weight: 600; }
  .goal-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--rule); }
  .goal-row:last-child { border-bottom: none; }
  .goal-row .gname { flex: 1; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
  .goal-row input { width: 92px; padding: 7px 8px; border: 1px solid var(--rule); border-radius: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; text-align: right; background: #fff; color: var(--ink); }
  .empty-note { text-align: center; color: var(--ink-soft); font-size: 13px; padding: 24px 10px; }
</style>
</head>
<body>
<div id="root" class="app"></div>

<script>
(function () {
  "use strict";

  // ---------- constants ----------
  var CATS = [
    { id: "dining", name: "Dining", color: "#5B7B4F", goal: 350 },
    { id: "groceries", name: "Groceries", color: "#35604A", goal: 300 },
    { id: "gas", name: "Gas", color: "#7A6A3D", goal: 45 },
    { id: "gifts", name: "Gifts", color: "#8B5A3A", goal: 150 },
    { id: "fun", name: "Fun", color: "#3D6B6B", goal: 80 },
    { id: "personal", name: "Personal", color: "#5F5A3D", goal: 140 },
    { id: "other", name: "Other", color: "#6B6B5B", goal: 25 }
  ];

  var SEED_EXPENSES = [
    { id: "e1", cat: "dining", date: "2026-01-13", desc: "New Hart. Diner", amt: 38.35 },
    { id: "e2", cat: "dining", date: "2026-01-21", desc: "Molto TO", amt: 68.55 },
    { id: "e3", cat: "dining", date: "2026-01-30", desc: "Senor Salsa", amt: 37.26 },
    { id: "e4", cat: "dining", date: "2026-02-09", desc: "Italian Kitchen", amt: 26.65 },
    { id: "e5", cat: "dining", date: "2026-02-16", desc: "T-Swirl Crepe", amt: 32.14 },
    { id: "e6", cat: "dining", date: "2026-02-16", desc: "Molto TO", amt: 67.47 },
    { id: "e7", cat: "dining", date: "2026-02-21", desc: "Sophie's Kitchen", amt: 81.31 },
    { id: "e8", cat: "groceries", date: "2026-01-20", desc: "CC + S&S", amt: 117.6 },
    { id: "e9", cat: "groceries", date: "2026-01-31", desc: "S&S", amt: 48.28 },
    { id: "e10", cat: "groceries", date: "2026-02-07", desc: "S&S", amt: 137.51 },
    { id: "e11", cat: "gas", date: "2026-01-15", desc: "Fill up", amt: 37.66 },
    { id: "e12", cat: "gifts", date: "2026-01-13", desc: "Secret Santa", amt: 17.51 },
    { id: "e13", cat: "gifts", date: "2026-02-12", desc: "Isabelle B-Day", amt: 132.94 },
    { id: "e14", cat: "gifts", date: "2026-02-16", desc: "Valentine's Day", amt: 82.9 },
    { id: "e15", cat: "fun", date: "2026-01-19", desc: "Dunkin'", amt: 10.81 },
    { id: "e16", cat: "fun", date: "2026-01-21", desc: "Boba", amt: 13.85 },
    { id: "e17", cat: "fun", date: "2026-02-07", desc: "Boba", amt: 15.85 },
    { id: "e18", cat: "fun", date: "2026-02-09", desc: "Gelato", amt: 22.2 },
    { id: "e19", cat: "fun", date: "2026-02-25", desc: "Dunkin'", amt: 21.41 },
    { id: "e20", cat: "personal", date: "2026-01-06", desc: "Haircut", amt: 41 },
    { id: "e21", cat: "personal", date: "2026-01-14", desc: "Car wash", amt: 21 },
    { id: "e22", cat: "personal", date: "2026-01-14", desc: "Stylus for iPad", amt: 42.53 },
    { id: "e23", cat: "personal", date: "2026-02-19", desc: "Haircut", amt: 42 },
    { id: "e24", cat: "other", date: "2026-02-16", desc: "CVS", amt: 17.54 }
  ];

  var STORAGE_KEY = "ledger-budget-data-v1";
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  function money(n) {
    return (Math.round((n + Number.EPSILON) * 100) / 100).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function uid() { return Math.random().toString(36).slice(2, 10); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ---------- state ----------
  var now = new Date();
  var state = {
    categories: JSON.parse(JSON.stringify(CATS)),
    expenses: JSON.parse(JSON.stringify(SEED_EXPENSES)),
    tab: "overview",
    viewYear: now.getFullYear(),
    viewMonth: now.getMonth()
  };

  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      if (parsed.categories) state.categories = parsed.categories;
      if (parsed.expenses) state.expenses = parsed.expenses;
    }
  } catch (e) { /* ignore, keep seed data */ }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ categories: state.categories, expenses: state.expenses }));
    } catch (e) { /* storage unavailable — ignore */ }
  }

  function monthKey() { return state.viewYear + "-" + String(state.viewMonth + 1).padStart(2, "0"); }

  function monthExpenses() {
    var mk = monthKey();
    return state.expenses.filter(function (e) { return e.date.indexOf(mk) === 0; });
  }

  function spentByCat() {
    var map = {};
    state.categories.forEach(function (c) { map[c.id] = 0; });
    monthExpenses().forEach(function (e) { map[e.cat] = (map[e.cat] || 0) + e.amt; });
    return map;
  }

  // ---------- rendering ----------
  function render() {
    var root = document.getElementById("root");
    var html = renderTopbar();
    if (state.tab === "overview") html += renderOverview();
    else if (state.tab === "log") html += renderLog();
    else if (state.tab === "goals") html += renderGoals();
    html += renderTabbar();
    root.innerHTML = html;
    attachShellListeners();
    if (state.tab === "log") attachLogListeners();
    if (state.tab === "goals") attachGoalsListeners();
  }

  function renderTopbar() {
    return (
      '<div class="topbar">' +
        '<div class="brand">Ledger <small>a spending &amp; goals tracker</small></div>' +
        '<div class="month-switch">' +
          '<button class="icon-btn" id="prevMonth" aria-label="Previous month">&lsaquo;</button>' +
          '<span class="label">' + MONTHS[state.viewMonth] + " " + state.viewYear + '</span>' +
          '<button class="icon-btn" id="nextMonth" aria-label="Next month">&rsaquo;</button>' +
        '</div>' +
      '</div>'
    );
  }

  function renderTabbar() {
    function tabBtn(id, glyph, label) {
      return '<button class="tab-btn ' + (state.tab === id ? "active" : "") + '" data-tab="' + id + '">' +
        '<span class="glyph">' + glyph + '</span>' + label + '</button>';
    }
    return '<div class="tabbar">' +
      tabBtn("overview", "&sect;", "Overview") +
      tabBtn("log", "+", "Log") +
      tabBtn("goals", "&#9678;", "Goals") +
      '</div>';
  }

  function renderOverview() {
    var spent = spentByCat();
    var totalGoal = state.categories.reduce(function (s, c) { return s + c.goal; }, 0);
    var totalSpent = 0;
    Object.keys(spent).forEach(function (k) { totalSpent += spent[k]; });

    var html =
      '<div class="totals-row">' +
        '<div class="total-card"><div class="k">Spent</div><div class="v ' + (totalSpent > totalGoal ? "red" : "") + '">$' + money(totalSpent) + '</div></div>' +
        '<div class="total-card"><div class="k">Goal</div><div class="v">$' + money(totalGoal) + '</div></div>' +
        '<div class="total-card"><div class="k">' + (totalGoal - totalSpent >= 0 ? "Left" : "Over") + '</div><div class="v ' + (totalGoal - totalSpent < 0 ? "red" : "") + '">$' + money(Math.abs(totalGoal - totalSpent)) + '</div></div>' +
      '</div>' +
      '<div class="section-title">Categories this month</div>' +
      '<div class="cat-list">';

    state.categories.forEach(function (c) {
      var s = spent[c.id] || 0;
      var pct = c.goal > 0 ? (s / c.goal) * 100 : (s > 0 ? 100 : 0);
      var over = s > c.goal;
      var clamped = Math.min(pct, 100);
      html +=
        '<div class="cat-card">' +
          '<div class="cat-top">' +
            '<div class="cat-name"><span class="cat-dot" style="background:' + c.color + '"></span>' + esc(c.name) + '</div>' +
            '<div class="cat-amounts"><span class="' + (over ? "over" : "") + '">$' + money(s) + '</span> / $' + money(c.goal) + '</div>' +
          '</div>' +
          '<div class="ruler-track"><div class="ruler-fill" style="width:' + clamped + '%;background:' + (over ? "#A22C2C" : "#2F5233") + '"></div><div class="ruler-ticks"></div></div>' +
          '<div class="cat-foot"><span>' + pct.toFixed(0) + '% of goal</span><span class="' + (over ? "over" : "") + '">' +
            (over ? "$" + money(s - c.goal) + " over" : "$" + money(c.goal - s) + " left") +
          '</span></div>' +
        '</div>';
    });

    html += '</div>';
    return html;
  }

  function defaultLogDate() {
    var d = new Date();
    if (d.getFullYear() === state.viewYear && d.getMonth() === state.viewMonth) return d.toISOString().slice(0, 10);
    return state.viewYear + "-" + String(state.viewMonth + 1).padStart(2, "0") + "-01";
  }

  function renderLog() {
    var sorted = monthExpenses().slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    var catOptions = state.categories.map(function (c) { return '<option value="' + c.id + '">' + esc(c.name) + '</option>'; }).join("");

    var html =
      '<div class="panel">' +
        '<div class="section-title" style="padding:0 0 8px">Log an expense</div>' +
        '<div class="form-card">' +
          '<div class="field"><label>Category</label><select id="logCat">' + catOptions + '</select></div>' +
          '<div class="field"><label>What</label><input type="text" id="logDesc" placeholder="e.g. Groceries run" /></div>' +
          '<div class="btn-row">' +
            '<div class="field" style="flex:1"><label>Amount</label><input class="mono-input" type="number" step="0.01" min="0" id="logAmt" placeholder="0.00" /></div>' +
            '<div class="field" style="flex:1"><label>Date</label><input class="mono-input" type="date" id="logDate" value="' + defaultLogDate() + '" /></div>' +
          '</div>' +
          '<button class="btn" id="logSubmit">+ Add expense</button>' +
        '</div>' +
        '<div class="section-title" style="padding:18px 0 4px">This month\'s entries</div>' +
        '<div class="form-card">';

    if (sorted.length === 0) {
      html += '<div class="empty-note">Nothing logged for this month yet.</div>';
    } else {
      sorted.forEach(function (e) {
        var c = state.categories.filter(function (x) { return x.id === e.cat; })[0];
        html +=
          '<div class="expense-row">' +
            '<div class="expense-main"><span class="expense-desc">' + esc(e.desc) + '</span>' +
            '<span class="expense-meta">' + e.date + " &middot; " + (c ? esc(c.name) : "&mdash;") + '</span></div>' +
            '<div style="display:flex;align-items:center">' +
              '<span class="expense-amt">$' + money(e.amt) + '</span>' +
              '<button class="del-btn" data-del="' + e.id + '" aria-label="Delete">&times;</button>' +
            '</div>' +
          '</div>';
      });
    }

    html += '</div></div>';
    return html;
  }

  function renderGoals() {
    var totalGoal = state.categories.reduce(function (s, c) { return s + c.goal; }, 0);
    var html =
      '<div class="panel">' +
        '<div class="allocate-card">' +
          '<div class="allocate-head">&#9878; Divide money among goals</div>' +
          '<div class="field"><label>Money to divide</label><input class="mono-input" type="number" step="0.01" min="0" id="poolInput" placeholder="e.g. 1100" /></div>' +
          '<div class="btn-row">' +
            '<button class="btn secondary" id="splitEven">Split evenly</button>' +
            '<button class="btn secondary" id="splitRatio">Match current ratios</button>' +
          '</div>' +
          '<div class="allocate-summary"><span id="allocatedLabel">Allocated: $0.00</span><span id="remainingLabel">Enter an amount above</span></div>' +
        '</div>' +
        '<div class="section-title" style="padding:0 0 4px">Monthly goal per category</div>' +
        '<div class="form-card">';

    state.categories.forEach(function (c) {
      html +=
        '<div class="goal-row">' +
          '<span class="gname"><span class="cat-dot" style="background:' + c.color + '"></span>' + esc(c.name) + '</span>' +
          '<input class="mono-input" type="number" step="0.01" min="0" data-goal="' + c.id + '" value="' + c.goal + '" />' +
        '</div>';
    });

    html += '</div><button class="btn" id="saveGoals" style="margin-top:14px">&check; Save goals (total $' + money(totalGoal) + ')</button></div>';
    return html;
  }

  // ---------- event wiring ----------
  function attachShellListeners() {
    document.getElementById("prevMonth").addEventListener("click", function () { shiftMonth(-1); });
    document.getElementById("nextMonth").addEventListener("click", function () { shiftMonth(1); });
    var tabs = document.querySelectorAll("[data-tab]");
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].addEventListener("click", function (e) {
        state.tab = e.currentTarget.getAttribute("data-tab");
        render();
      });
    }
  }

  function shiftMonth(delta) {
    var m = state.viewMonth + delta, y = state.viewYear;
    if (m < 0) { m = 11; y -= 1; }
    if (m > 11) { m = 0; y += 1; }
    state.viewMonth = m; state.viewYear = y;
    render();
  }

  function attachLogListeners() {
    document.getElementById("logSubmit").addEventListener("click", function () {
      var cat = document.getElementById("logCat").value;
      var desc = document.getElementById("logDesc").value.trim() || "Untitled";
      var amt = parseFloat(document.getElementById("logAmt").value);
      var date = document.getElementById("logDate").value;
      if (!amt || amt <= 0 || !date) return;
      state.expenses.unshift({ id: uid(), cat: cat, desc: desc, amt: Math.round(amt * 100) / 100, date: date });
      save();
      render();
    });
    var delBtns = document.querySelectorAll("[data-del]");
    for (var i = 0; i < delBtns.length; i++) {
      delBtns[i].addEventListener("click", function (e) {
        var id = e.currentTarget.getAttribute("data-del");
        state.expenses = state.expenses.filter(function (x) { return x.id !== id; });
        save();
        render();
      });
    }
  }

  function attachGoalsListeners() {
    var poolInput = document.getElementById("poolInput");
    var goalInputs = document.querySelectorAll("[data-goal]");

    function updateSummary() {
      var draftTotal = 0;
      goalInputs.forEach(function (inp) { draftTotal += parseFloat(inp.value) || 0; });
      var pool = parseFloat(poolInput.value);
      document.getElementById("allocatedLabel").textContent = "Allocated: $" + money(draftTotal);
      var remLabel = document.getElementById("remainingLabel");
      if (poolInput.value === "" || isNaN(pool)) {
        remLabel.textContent = "Enter an amount above";
        remLabel.className = "";
      } else {
        var remaining = pool - draftTotal;
        remLabel.textContent = (remaining >= 0 ? "Unallocated" : "Over by") + ": $" + money(Math.abs(remaining));
        remLabel.className = remaining < 0 ? "neg" : "";
      }
    }

    poolInput.addEventListener("input", updateSummary);
    goalInputs.forEach(function (inp) { inp.addEventListener("input", updateSummary); });

    document.getElementById("splitEven").addEventListener("click", function () {
      var pool = parseFloat(poolInput.value);
      if (!pool || pool <= 0) return;
      var n = goalInputs.length;
      var each = Math.floor((pool / n) * 100) / 100;
      goalInputs.forEach(function (inp, i) {
        inp.value = i === n - 1 ? (Math.round((pool - each * (n - 1)) * 100) / 100).toFixed(2) : each.toFixed(2);
      });
      updateSummary();
    });

    document.getElementById("splitRatio").addEventListener("click", function () {
      var pool = parseFloat(poolInput.value);
      if (!pool || pool <= 0) return;
      var currentTotal = state.categories.reduce(function (s, c) { return s + c.goal; }, 0);
      if (currentTotal <= 0) {
        document.getElementById("splitEven").click();
        return;
      }
      var running = 0;
      var n = goalInputs.length;
      goalInputs.forEach(function (inp, i) {
        var catId = inp.getAttribute("data-goal");
        var cat = state.categories.filter(function (c) { return c.id === catId; })[0];
        if (i === n - 1) {
          inp.value = (Math.round((pool - running) * 100) / 100).toFixed(2);
        } else {
          var v = Math.round(((cat.goal / currentTotal) * pool) * 100) / 100;
          inp.value = v.toFixed(2);
          running += v;
        }
      });
      updateSummary();
    });

    document.getElementById("saveGoals").addEventListener("click", function () {
      goalInputs.forEach(function (inp) {
        var catId = inp.getAttribute("data-goal");
        var val = Math.max(0, parseFloat(inp.value) || 0);
        var cat = state.categories.filter(function (c) { return c.id === catId; })[0];
        if (cat) cat.goal = val;
      });
      save();
      render();
    });
  }

  render();
})();
</script>
</body>
</html>
